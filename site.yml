---
- name: Provision gate ANPR stack on Pi 5 (Bookworm-safe)
  hosts: gatepi
  become: true

  vars:
    app_dir: /opt/gate_anpr
    plates_dir: /home/pi/plates
    alpr_conf_dir: /etc/openalpr
    alprd_conf_path: /etc/openalpr/alprd.conf
    openalpr_conf_path: /etc/openalpr/openalpr.conf
    venv_path: /opt/gate_anpr/venv
    script_path: /opt/gate_anpr/gate_anpr.py

    # Source build locations
    src_root: /opt/src
    openalpr_repo: https://github.com/openalpr/openalpr.git
    openalpr_src: /opt/src/openalpr
    openalpr_build: /opt/src/openalpr/build
    openalpr_install_prefix: /usr/local
    openalpr_sysconfdir: /etc
    alprd_bin: /usr/local/bin/alprd
    alprd_stream: "{{ lookup('env', 'ALPRD_STREAM') | default('/dev/video0', true) }}"
    alprd_stream_is_device: "{{ alprd_stream is match('^/dev/') }}"
    alprd_stream_is_http: "{{ alprd_stream is match('^https?://') }}"
    alprd_rtsp_url: "{{ lookup('env', 'ALPRD_RTSP_URL') | default('', true) }}"
    alprd_rtsp_source: >-
      {{ alprd_rtsp_url if alprd_rtsp_url | length > 0 else (alprd_stream if not alprd_stream_is_device else '') }}
    alprd_v4l2_device: "{{ lookup('env', 'ALPRD_V4L2_DEVICE') | default('/dev/video10', true) }}"
    alprd_v4l2_web_device: "{{ lookup('env', 'ALPRD_V4L2_WEB_DEVICE') | default('/dev/video11', true) }}"
    alprd_v4l2_fps: "{{ lookup('env', 'ALPRD_V4L2_FPS') | default('4', true) }}"
    alprd_v4l2_video_nr: "{{ (alprd_v4l2_device | regex_search('[0-9]+')) | default('10', true) }}"
    alprd_v4l2_web_video_nr: "{{ (alprd_v4l2_web_device | regex_search('[0-9]+')) | default('11', true) }}"
    alprd_v4l2_video_nrs: "{{ alprd_v4l2_video_nr }},{{ alprd_v4l2_web_video_nr }}"
    alprd_v4l2_exclusive_caps: "{{ lookup('env', 'ALPRD_V4L2_EXCLUSIVE_CAPS') | default('1,1', true) }}"
    alprd_v4l2_enabled: "{{ alprd_stream_is_device and (alprd_rtsp_source | length > 0) }}"
    run_openalpr_smoketest: false
    alprd_cpu_affinity: "{{ lookup('env', 'ALPRD_CPU_AFFINITY') | default('', true) }}"
    alprd_roi: "{{ lookup('env', 'ALPRD_ROI') | default('', true) }}"
    gate_web_stream_url: "{{ lookup('env', 'GATE_WEB_STREAM_URL') | default('/static/stream.jpg', true) }}"
    gate_web_stream_rtsp_url: "{{ lookup('env', 'GATE_WEB_STREAM_RTSP_URL') | default(alprd_rtsp_source, true) }}"
    gate_web_stream_fps: "{{ lookup('env', 'GATE_WEB_STREAM_FPS') | default('5', true) }}"
    gate_web_stream_width: "{{ lookup('env', 'GATE_WEB_STREAM_WIDTH') | default('1280', true) }}"
    gate_web_stream_height: "{{ lookup('env', 'GATE_WEB_STREAM_HEIGHT') | default('720', true) }}"
    gate_web_stream_encoder: "{{ lookup('env', 'GATE_WEB_STREAM_ENCODER') | default('libx264', true) }}"
    gate_web_stream_hls_dir: "{{ app_dir }}/web/static/hls"
    gate_web_stream_jpeg: "{{ app_dir }}/web/static/stream.jpg"
    gatepi_alias_hostname: "{{ lookup('env', 'GATEPI_ALIAS_HOSTNAME') | default('gate', true) }}"
    cleanup_legacy: false

    # OpenCV 3.x build (match old Pi stack)
    build_opencv3: false
    cleanup_opencv3: true
    install_openalpr_from_apt: false
    opencv_version: "3.2.0"
    opencv_repo: https://github.com/opencv/opencv.git
    opencv_src: /opt/src/opencv
    opencv_build: /opt/src/opencv/build
    opencv_install_prefix: /opt/opencv-3.2.0
    ffmpeg_version: "n3.4.13"
    ffmpeg_repo: https://git.ffmpeg.org/ffmpeg.git
    ffmpeg_src: /opt/src/ffmpeg
    ffmpeg_install_prefix: /opt/ffmpeg-3.4

  tasks:
    - name: Remove Debian bullseye repo (cleanup OpenCV 3.x attempt)
      file:
        path: /etc/apt/sources.list.d/bullseye.list
        state: absent
      when: cleanup_opencv3 | bool

    - name: Remove bullseye cmake pin (cleanup OpenCV 3.x attempt)
      file:
        path: /etc/apt/preferences.d/cmake-bullseye
        state: absent
      when: cleanup_opencv3 | bool

    - name: Remove OpenCV 3 build artifacts (cleanup OpenCV 3.x attempt)
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ opencv_src }}"
        - "{{ opencv_install_prefix }}"
        - /etc/ld.so.conf.d/opencv-3.conf
      when: cleanup_opencv3 | bool

    - name: Update apt cache after cleanup
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: cleanup_opencv3 | bool

    - name: Ensure cmake is on the default distro version after cleanup
      apt:
        name:
          - cmake
          - cmake-data
        state: latest
      when: cleanup_opencv3 | bool

    - name: Add Debian bullseye repo (for older cmake)
      copy:
        dest: /etc/apt/sources.list.d/bullseye.list
        owner: root
        group: root
        mode: "0644"
        content: |
          deb http://deb.debian.org/debian bullseye main
      when: build_opencv3 | bool

    - name: Pin cmake packages to bullseye
      copy:
        dest: /etc/apt/preferences.d/cmake-bullseye
        owner: root
        group: root
        mode: "0644"
        content: |
          Package: cmake cmake-data
          Pin: release n=bullseye
          Pin-Priority: 990
      when: build_opencv3 | bool

    - name: Update apt cache after adding bullseye repo
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: build_opencv3 | bool

    - name: Read installed cmake version
      command: dpkg-query -W -f='${Version}' cmake
      register: cmake_version
      changed_when: false
      failed_when: false
      when: build_opencv3 | bool

    - name: Read installed cmake-data version
      command: dpkg-query -W -f='${Version}' cmake-data
      register: cmake_data_version
      changed_when: false
      failed_when: false
      when: build_opencv3 | bool

    - name: Check if bullseye cmake version is available
      ansible.builtin.shell: apt-cache policy cmake | grep -q "3.18.4-2+deb11u1"
      register: cmake_bullseye_available
      changed_when: false
      failed_when: false
      when: build_opencv3 | bool

    - name: Install bullseye cmake (older version for OpenCV 3.2)
      ansible.builtin.shell: |
        apt-get -y --allow-downgrades install \
          cmake=3.18.4-2+deb11u1 \
          cmake-data=3.18.4-2+deb11u1
      when:
        - build_opencv3 | bool
        - cmake_bullseye_available.rc == 0
        - cmake_version.stdout != "3.18.4-2+deb11u1"
          or cmake_data_version.stdout != "3.18.4-2+deb11u1"

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Remove OpenCV 4 packages (ensure clean OpenCV 3 build)
      apt:
        name:
          - libopencv-dev
          - libopencv-core-dev
          - libopencv-imgproc-dev
          - libopencv-highgui-dev
          - libopencv-videoio-dev
          - libopencv-calib3d-dev
          - libopencv-features2d-dev
          - libopencv-imgcodecs-dev
          - libopencv-dnn-dev
          - libopencv-objdetect-dev
          - libopencv-ml-dev
          - libopencv-photo-dev
          - libopencv-shape-dev
          - libopencv-stitching-dev
          - libopencv-superres-dev
          - libopencv-video-dev
          - opencv-data
          - python3-opencv
        state: absent
        purge: yes
      when: build_opencv3 | bool

    - name: Remove OpenCV 4 local install leftovers
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/local/include/opencv4
        - /usr/local/lib/cmake/opencv4
        - /usr/local/share/opencv4
        - /usr/local/lib/pkgconfig/opencv4.pc
      when: build_opencv3 | bool

    - name: Find OpenCV libs in /usr/local/lib
      find:
        paths: /usr/local/lib
        patterns: "libopencv*"
        file_type: file
      register: opencv4_local_libs
      when: build_opencv3 | bool

    - name: Remove OpenCV libs in /usr/local/lib
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ opencv4_local_libs.files }}"
      when: build_opencv3 | bool

    - name: Refresh linker cache after removing OpenCV 4
      command: ldconfig
      when: build_opencv3 | bool

    - name: Install baseline runtime packages
      apt:
        name:
          - beanstalkd
          - python3
          - python3-venv
          - python3-pip
          - python3-gi
          - gir1.2-gstreamer-1.0
          - gir1.2-gst-plugins-base-1.0
          - python3-rpi.gpio
          - python3-lgpio
          - sqlite3
          - util-linux
          - ffmpeg
          - unzip
          - avahi-daemon
        state: present

    - name: Install v4l2 utilities (if enabled)
      apt:
        name:
          - v4l-utils
        state: present
      when: alprd_v4l2_enabled | bool

    - name: Install Raspberry Pi kernel headers for v4l2loopback (if enabled)
      apt:
        name:
          - raspberrypi-kernel-headers
        state: present
      when: alprd_v4l2_enabled | bool
      register: rpi_kernel_headers
      failed_when: false

    - name: Install generic kernel headers for v4l2loopback (if enabled)
      apt:
        name:
          - "linux-headers-{{ ansible_kernel }}"
        state: present
      when:
        - alprd_v4l2_enabled | bool
        - rpi_kernel_headers is defined
        - rpi_kernel_headers is failed

    - name: Install v4l2loopback (if enabled)
      apt:
        name:
          - v4l2loopback-dkms
        state: present
      when: alprd_v4l2_enabled | bool

    - name: Configure v4l2loopback to load at boot (if enabled)
      copy:
        dest: /etc/modules-load.d/v4l2loopback.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          v4l2loopback
      when: alprd_v4l2_enabled | bool

    - name: Configure v4l2loopback options (if enabled)
      copy:
        dest: /etc/modprobe.d/v4l2loopback.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          options v4l2loopback video_nr={{ alprd_v4l2_video_nrs }} card_label="rtsp_hwdec,rtsp_web" exclusive_caps={{ alprd_v4l2_exclusive_caps }}
      when: alprd_v4l2_enabled | bool

    - name: Stop v4l2-dependent services before reloading module (if enabled)
      systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - gate_anpr_stream_jpeg
        - gate_anpr_rtsp_v4l2
        - alprd
      failed_when: false
      when: alprd_v4l2_enabled | bool

    - name: Unload v4l2loopback module to apply new options (if enabled)
      modprobe:
        name: v4l2loopback
        state: absent
      failed_when: false
      when: alprd_v4l2_enabled | bool

    - name: Load v4l2loopback module now (if enabled)
      modprobe:
        name: v4l2loopback
        params: "video_nr={{ alprd_v4l2_video_nrs }} card_label=rtsp_hwdec,rtsp_web exclusive_caps={{ alprd_v4l2_exclusive_caps }}"
        state: present
      when: alprd_v4l2_enabled | bool

    - name: Gather service facts (legacy cleanup)
      service_facts:
      when: cleanup_legacy | bool

    - name: Stop and disable deprecated ALPR MJPEG stream service (if present)
      systemd:
        name: gate_anpr_alpr_stream
        enabled: false
        state: stopped
      failed_when: false
      when:
        - cleanup_legacy | bool
        - ansible_facts.services["gate_anpr_alpr_stream.service"] is defined

    - name: Stop and disable deprecated local MJPEG stream service (if present)
      systemd:
        name: gate_anpr_stream
        enabled: false
        state: stopped
      failed_when: false
      when:
        - cleanup_legacy | bool
        - ansible_facts.services["gate_anpr_stream.service"] is defined

    - name: Stop and disable deprecated HLS stream service (if present)
      systemd:
        name: gate_anpr_stream_rtsp
        enabled: false
        state: stopped
      failed_when: false
      when:
        - cleanup_legacy | bool
        - ansible_facts.services["gate_anpr_stream_rtsp.service"] is defined

    - name: Remove deprecated ONVIF/MJPEG artifacts
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/gate_anpr_alpr_stream.service
        - /etc/systemd/system/gate_anpr_stream_rtsp.service
        - /opt/gate_anpr/rtsp_mjpeg_server.py
        - /opt/gate_anpr/onvif_venv
        - /opt/gate_anpr/onvif_wsdl
        - /tmp/onvif_wsdl.zip
        - /tmp/onvif_wsdl_src
        - /tmp/onvif_set_encoder.py
        - /var/log/gate-anpr
        - /etc/systemd/system/gate_anpr_stream.service
      notify: daemon-reload
      when: cleanup_legacy | bool

    - name: Ensure systemd-timesyncd is enabled
      systemd:
        name: systemd-timesyncd
        enabled: true
        state: started

    - name: Check if system time is unreasonable
      set_fact:
        time_needs_fix: "{{ ansible_facts['date_time'].year | int > 2025 }}"

    - name: Set system time from controller when clock is wrong
      command: date -u -s "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
      when: time_needs_fix

    - name: Check for hwclock binary
      command: command -v hwclock
      register: hwclock_path
      changed_when: false
      failed_when: false

    - name: Sync hardware clock from system time
      command: "{{ hwclock_path.stdout }} --systohc"
      when:
        - time_needs_fix
        - hwclock_path.rc == 0

    - name: Ensure NTP sync is enabled
      command: timedatectl set-ntp true
      changed_when: false

    - name: Restart systemd-timesyncd to resync time
      systemd:
        name: systemd-timesyncd
        state: restarted

    - name: Configure avahi alias hostname
      copy:
        dest: /etc/avahi/hosts
        owner: root
        group: root
        mode: "0644"
        content: |
          {{ ansible_default_ipv4.address }} {{ gatepi_alias_hostname }}
      when: gatepi_alias_hostname | length > 0
      notify: restart avahi-daemon

    - name: Enable and start avahi-daemon
      systemd:
        name: avahi-daemon
        enabled: true
        state: started
      when: gatepi_alias_hostname | length > 0

    # --- Attempt APT OpenALPR (works on some older distros; not on Bookworm) ---
    - name: Try to install OpenALPR packages from apt (may not exist)
      apt:
        name:
          - openalpr
          - openalpr-daemon
          - openalpr-utils
        state: present
      register: apt_openalpr
      ignore_errors: true
      when: install_openalpr_from_apt | bool

    - name: Check for existing alprd binary
      stat:
        path: "{{ alprd_bin }}"
      register: alprd_existing

    - name: Check if existing alprd is usable
      command: "{{ alprd_bin }} --version"
      register: alprd_version_check
      changed_when: false
      failed_when: false
      when: alprd_existing.stat.exists

    - name: Mark alprd usability
      set_fact:
        alprd_usable: "{{ alprd_existing.stat.exists and (alprd_version_check.rc | default(1)) in [0, 1] }}"

    - name: Decide if we must build OpenALPR from source
      set_fact:
        build_openalpr_from_source: >-
          {{ (not alprd_usable) and
             ((not install_openalpr_from_apt | bool) or (apt_openalpr is failed)) }}

    # --- If apt failed, build from source (Bookworm-safe path) ---
    - name: Install build dependencies for OpenALPR (only if building)
      apt:
        name:
          - git
          - cmake
          - build-essential
          - pkg-config
          - libopencv-dev
          - libleptonica-dev
          - libtesseract-dev
          - tesseract-ocr
          - liblog4cplus-dev
          - libcurl4-openssl-dev
          - libcurlpp-dev
          - libjsoncpp-dev
          - libpng-dev
          - libjpeg-dev
          - zlib1g-dev
        state: present
      when: build_openalpr_from_source

    - name: Install build dependencies for FFmpeg 3.4 (only if building OpenCV 3)
      apt:
        name:
          - autoconf
          - automake
          - libtool
          - pkg-config
          - yasm
          - nasm
        state: present
      when: build_opencv3 | bool

    - name: Clone FFmpeg source (only if building OpenCV 3)
      git:
        repo: "{{ ffmpeg_repo }}"
        dest: "{{ ffmpeg_src }}"
        version: "{{ ffmpeg_version }}"
        depth: 1
      when: build_opencv3 | bool

    - name: Clear FFmpeg config (only when cleaning OpenCV 3 build)
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ ffmpeg_src }}/config.h"
        - "{{ ffmpeg_src }}/config.mak"
      when:
        - build_opencv3 | bool
        - cleanup_opencv3 | bool

    - name: Configure FFmpeg 3.4 (only if building OpenCV 3)
      command: >
        ./configure
        --prefix={{ ffmpeg_install_prefix }}
        --enable-shared
        --disable-static
        --disable-debug
        --extra-cflags='-Wno-error=incompatible-pointer-types -Wno-error'
        --enable-gpl
      args:
        chdir: "{{ ffmpeg_src }}"
        creates: "{{ ffmpeg_src }}/config.h"
      when: build_opencv3 | bool

    - name: Build FFmpeg 3.4 (only if building OpenCV 3)
      command: make -j2
      args:
        chdir: "{{ ffmpeg_src }}"
      when: build_opencv3 | bool

    - name: Install FFmpeg 3.4 (only if building OpenCV 3)
      command: make install
      args:
        chdir: "{{ ffmpeg_src }}"
        creates: "{{ ffmpeg_install_prefix }}/bin/ffmpeg"
      when: build_opencv3 | bool

    - name: Refresh linker cache (FFmpeg 3.4)
      command: ldconfig
      when: build_opencv3 | bool

    - name: Install build dependencies for OpenCV 3 (only if building OpenCV 3)
      apt:
        name:
          - git
          - cmake
          - build-essential
          - gcc-12
          - g++-12
          - pkg-config
          - libgtk-3-dev
          - libavcodec-dev
          - libavformat-dev
          - libavutil-dev
          - libswscale-dev
          - libswresample-dev
          - libavdevice-dev
          - libgstreamer1.0-dev
          - libgstreamer-plugins-base1.0-dev
          - libv4l-dev
          - libxvidcore-dev
          - libx264-dev
          - libjpeg-dev
          - libpng-dev
          - libtiff-dev
        state: present
      when: build_opencv3 | bool

    - name: Ensure source root exists (only if building)
      file:
        path: "{{ src_root }}"
        state: directory
        mode: "0755"
      when: build_openalpr_from_source

    - name: Clone OpenCV source (only if building OpenCV 3)
      git:
        repo: "{{ opencv_repo }}"
        dest: "{{ opencv_src }}"
        version: "{{ opencv_version }}"
        depth: 1
      when: build_opencv3 | bool

    - name: Reset OpenCV compiler options file (OpenCV 3 build compatibility)
      command: git checkout -- cmake/OpenCVCompilerOptions.cmake
      args:
        chdir: "{{ opencv_src }}"
      when: build_opencv3 | bool

    - name: Normalize OpenCV ccache block (OpenCV 3 build compatibility)
      replace:
        path: "{{ opencv_src }}/cmake/OpenCVCompilerOptions.cmake"
        regexp: "(?ms)^if\\(ENABLE_CCACHE AND NOT CMAKE_COMPILER_IS_CCACHE\\).*?^endif\\(\\)$"
        replace: |
          if(ENABLE_CCACHE AND NOT CMAKE_COMPILER_IS_CCACHE)
            # This works fine with Unix Makefiles and Ninja generators
            find_host_program(CCACHE_PROGRAM ccache)
            if(CCACHE_PROGRAM)
              message(STATUS "Looking for ccache - found (${CCACHE_PROGRAM})")
              get_property(__OLD_RULE_LAUNCH_COMPILE GLOBAL PROPERTY RULE_LAUNCH_COMPILE)
              if(__OLD_RULE_LAUNCH_COMPILE)
                message(STATUS "Can't replace CMake compiler launcher")
              else()
                set_property(GLOBAL PROPERTY RULE_LAUNCH_COMPILE "${CCACHE_PROGRAM}")
                # NOTE: Actually this check doesn't work as expected.
                # "RULE_LAUNCH_COMPILE" is ignored by CMake during try_compile() step.
                # ocv_check_compiler_flag(CXX "" IS_CCACHE_WORKS)
                set(IS_CCACHE_WORKS 1)
                if(IS_CCACHE_WORKS)
                  set(CMAKE_COMPILER_IS_CCACHE 1)
                else()
                  message(STATUS "Unable to compile program with enabled ccache, reverting...")
                  set_property(GLOBAL PROPERTY RULE_LAUNCH_COMPILE "${__OLD_RULE_LAUNCH_COMPILE}")
                endif()
              endif()
            else()
              message(STATUS "Looking for ccache - not found")
            endif()
          endif()
      when: build_opencv3 | bool

    - name: Remove OpenCV -Werror compiler options (OpenCV 3 build compatibility)
      lineinfile:
        path: "{{ opencv_src }}/cmake/OpenCVCompilerOptions.cmake"
        regexp: "^\\s*add_extra_compiler_option\\(-Werror.*\\)$"
        state: absent
      when: build_opencv3 | bool

    - name: Clear OpenCV build dir
      file:
        path: "{{ opencv_build }}"
        state: absent
      when: build_opencv3 | bool

    - name: Configure OpenCV build (only if building OpenCV 3)
      command:
        argv:
          - cmake
          - -S
          - "{{ opencv_src }}"
          - -B
          - "{{ opencv_build }}"
          - -DCMAKE_BUILD_TYPE=Release
          - "-DCMAKE_INSTALL_PREFIX={{ opencv_install_prefix }}"
          - -DCMAKE_C_COMPILER=/usr/bin/gcc-12
          - -DCMAKE_CXX_COMPILER=/usr/bin/g++-12
          - -DCMAKE_C_STANDARD=11
          - -DCMAKE_CXX_STANDARD=11
          - -DOPENCV_WARNINGS_ARE_ERRORS=OFF
          - "-DCMAKE_C_FLAGS=-Wno-error -Wno-error=address"
          - "-DCMAKE_CXX_FLAGS=-Wno-error -Wno-error=address"
          - -DBUILD_TESTS=OFF
          - -DBUILD_PERF_TESTS=OFF
          - -DBUILD_EXAMPLES=OFF
          - -DBUILD_opencv_python2=OFF
          - -DBUILD_opencv_python3=OFF
          - -DWITH_CAROTENE=OFF
          - -DWITH_FFMPEG=ON
          - -DWITH_GSTREAMER=OFF
          - "-DCMAKE_EXE_LINKER_FLAGS=-Wl,-rpath,{{ ffmpeg_install_prefix }}/lib -Wl,-rpath-link,{{ ffmpeg_install_prefix }}/lib"
          - "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-rpath,{{ ffmpeg_install_prefix }}/lib -Wl,-rpath-link,{{ ffmpeg_install_prefix }}/lib"
      environment:
        PKG_CONFIG_PATH: "{{ ffmpeg_install_prefix }}/lib/pkgconfig"
        LD_LIBRARY_PATH: "{{ ffmpeg_install_prefix }}/lib"
      args:
        creates: "{{ opencv_build }}/Makefile"
      when: build_opencv3 | bool

    - name: Build OpenCV 3 (only if building OpenCV 3)
      command: cmake --build {{ opencv_build }} -j2
      environment:
        LD_LIBRARY_PATH: "{{ ffmpeg_install_prefix }}/lib"
      when: build_opencv3 | bool

    - name: Install OpenCV 3 (only if building OpenCV 3)
      command: cmake --install {{ opencv_build }}
      environment:
        LD_LIBRARY_PATH: "{{ ffmpeg_install_prefix }}/lib"
      when: build_opencv3 | bool

    - name: Register OpenCV 3 library path
      copy:
        dest: /etc/ld.so.conf.d/opencv-3.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          {{ opencv_install_prefix }}/lib
      when: build_opencv3 | bool

    - name: Refresh linker cache (OpenCV 3)
      command: ldconfig
      when: build_opencv3 | bool

    - name: Clone OpenALPR source (only if building)
      git:
        repo: "{{ openalpr_repo }}"
        dest: "{{ openalpr_src }}"
        depth: 1
      when: build_openalpr_from_source

    - name: Clear OpenALPR build dir (non-OpenCV3 rebuild)
      file:
        path: "{{ openalpr_build }}"
        state: absent
      when:
        - build_openalpr_from_source
        - not (build_opencv3 | bool)

    - name: Clear OpenALPR build dir when using OpenCV 3
      file:
        path: "{{ openalpr_build }}"
        state: absent
      when: build_openalpr_from_source and (build_opencv3 | bool)

    - name: Set OpenALPR cmake extra args (base)
      set_fact:
        openalpr_cmake_extra: >-
          -DCMAKE_EXE_LINKER_FLAGS=-Wl,-rpath,{{ ffmpeg_install_prefix }}/lib -Wl,-rpath-link,{{ ffmpeg_install_prefix }}/lib
          -DCMAKE_SHARED_LINKER_FLAGS=-Wl,-rpath,{{ ffmpeg_install_prefix }}/lib -Wl,-rpath-link,{{ ffmpeg_install_prefix }}/lib
      when: build_openalpr_from_source

    - name: Set OpenALPR cmake extra args for OpenCV 3
      set_fact:
        openalpr_cmake_extra: >-
          -DCMAKE_EXE_LINKER_FLAGS=-Wl,-rpath,{{ ffmpeg_install_prefix }}/lib -Wl,-rpath-link,{{ ffmpeg_install_prefix }}/lib
          -DCMAKE_SHARED_LINKER_FLAGS=-Wl,-rpath,{{ ffmpeg_install_prefix }}/lib -Wl,-rpath-link,{{ ffmpeg_install_prefix }}/lib
          -DCMAKE_PREFIX_PATH={{ opencv_install_prefix }}
          -DOpenCV_DIR={{ opencv_install_prefix }}/share/OpenCV
      when: build_openalpr_from_source and (build_opencv3 | bool)

    - name: Configure OpenALPR build (only if building)
      command: >
        cmake -S {{ openalpr_src }}/src -B {{ openalpr_build }}
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_INSTALL_PREFIX={{ openalpr_install_prefix }}
        -DCMAKE_INSTALL_SYSCONFDIR={{ openalpr_sysconfdir }}
        -DTesseract_INCLUDE_DIR=/usr/include/tesseract
        -DTesseract_INCLUDE_CCMAIN_DIR=/usr/include/tesseract
        -DTesseract_INCLUDE_CCUTIL_DIR=/usr/include/tesseract
        -DTesseract_LIB=/usr/lib/aarch64-linux-gnu/libtesseract.so
        -DLeptonica_INCLUDE_DIR=/usr/include/leptonica
        -DLeptonica_LIB=/usr/lib/aarch64-linux-gnu/libleptonica.so
        {{ openalpr_cmake_extra | default('') }}
      args:
        creates: "{{ openalpr_build }}/Makefile"
      environment:
        LD_LIBRARY_PATH: "{{ ffmpeg_install_prefix }}/lib"
      when: build_openalpr_from_source


    - name: Build OpenALPR (only if building)
      command: cmake --build {{ openalpr_build }} -j2
      environment:
        LD_LIBRARY_PATH: "{{ ffmpeg_install_prefix }}/lib"
      when: build_openalpr_from_source

    - name: Install OpenALPR (only if building)
      command: cmake --install {{ openalpr_build }}
      environment:
        LD_LIBRARY_PATH: "{{ ffmpeg_install_prefix }}/lib"
      when: build_openalpr_from_source

    - name: Refresh linker cache (only if building)
      command: ldconfig
      when: build_openalpr_from_source

    - name: Determine OpenALPR share directory
      stat:
        path: /usr/local/share/openalpr
      register: openalpr_share_local

    - name: Set OpenALPR share directory fact
      set_fact:
        openalpr_share_dir: "{{ '/usr/local/share/openalpr' if openalpr_share_local.stat.exists else '/usr/share/openalpr' }}"

    - name: Check for local OpenALPR test image
      stat:
        path: tests/Test Image.png
      delegate_to: localhost
      become: false
      run_once: true
      register: openalpr_test_image

    - name: Fail if smoketest requested but test image is missing
      fail:
        msg: "OpenALPR smoketest requested but tests/Test Image.png is missing."
      when: run_openalpr_smoketest | bool and (not openalpr_test_image.stat.exists)

    - name: Copy OpenALPR test image (if present)
      copy:
        src: tests/Test Image.png
        dest: /tmp/openalpr_test.png
        owner: root
        group: root
        mode: "0644"
      when: openalpr_test_image.stat.exists

    - name: Run OpenALPR smoketest (optional)
      command: alpr -c eu -n 10 /tmp/openalpr_test.png
      register: openalpr_smoketest
      changed_when: false
      when: run_openalpr_smoketest | bool and openalpr_test_image.stat.exists

    - name: Fail if smoketest finds no plates
      fail:
        msg: "OpenALPR smoketest failed: no plates detected in tests/Test Image.png."
      when: run_openalpr_smoketest | bool and ('No license plates found.' in openalpr_smoketest.stdout)

    # --- OpenALPR config files ---
    - name: Ensure OpenALPR config directory exists
      file:
        path: "{{ alpr_conf_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure alprd log file exists (writable by pi)
      file:
        path: /var/log/alpr.log
        state: touch
        owner: pi
        group: pi
        mode: "0644"

    - name: Render alprd.conf (site-specific)
      template:
        src: files/alprd.conf.j2
        dest: "{{ alprd_conf_path }}"
        owner: root
        group: root
        mode: "0644"
      notify: restart alprd

    - name: Set openalpr.conf for gb and legacy tuning
      copy:
        dest: "{{ openalpr_conf_path }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          ; Use runtime/config copied from old Pi (apt layout)
          config_file = {{ openalpr_share_dir }}/config/openalpr.defaults.conf
          runtime_dir = {{ openalpr_share_dir }}/runtime_data
          country = gb
          max_plate_width_percent = 30
          max_plate_height_percent = 10
          topn = 5
          must_match_pattern = 1
      notify: restart alprd

    - name: Replace GB plate patterns with a broad set
      copy:
        dest: "{{ openalpr_share_dir }}/runtime_data/postprocess/gb.patterns"
        owner: root
        group: root
        mode: "0644"
        content: |
          gb	@@##@@@
          gb	@###@@@
          gb	@@@###@
          gb	@#@@@
          gb	@@###
          gb	@@####
          gb	@@#@@@
          gb	@@##@@
          gb	@@@###
          gb	@@@##
          gb	@@@#
          gb	@@##
          gb	@@#
          gb	@####
          gb	@###
          gb	@##
          gb	@#
          gb	####@@
          gb	###@@
          gb	##@@
          gb	#@@
          gb	@@@##
          gb	@@@###
          gb	###@
          gb	##@
          gb	#@
          gb	@@@#
          gb	@@##
          gb	###@@@
          gb	##@@@
          gb	#@@@
      notify: restart alprd

    # --- Runtime dirs ---
    - name: Ensure plates directory exists
      file:
        path: "{{ plates_dir }}"
        state: directory
        owner: pi
        group: pi
        mode: "0755"

    - name: Ensure app directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: pi
        group: pi
        mode: "0755"

    - name: Ensure events database exists
      file:
        path: "{{ app_dir }}/events.db"
        state: touch
        owner: pi
        group: pi
        mode: "0644"

    - name: Ensure app tests directory exists
      file:
        path: "{{ app_dir }}/tests"
        state: directory
        owner: pi
        group: pi
        mode: "0755"

    - name: Ensure web app directory exists
      file:
        path: "{{ app_dir }}/web"
        state: directory
        owner: pi
        group: pi
        mode: "0755"

    - name: Ensure HLS stream directory exists (legacy RTSP restream)
      file:
        path: "{{ gate_web_stream_hls_dir }}"
        state: directory
        owner: pi
        group: pi
        mode: "0755"
      when: gate_web_stream_rtsp_url | length > 0 or alprd_v4l2_enabled | bool

    - name: Copy synthetic job helper
      copy:
        src: tests/synthetic_job.py
        dest: "{{ app_dir }}/tests/synthetic_job.py"
        owner: pi
        group: pi
        mode: "0755"

    - name: Copy web app backend
      copy:
        src: files/web/app.py
        dest: "{{ app_dir }}/web/app.py"
        owner: pi
        group: pi
        mode: "0755"
      notify: restart gate_anpr_web

    - name: Copy web app static files
      copy:
        src: files/web/static/
        dest: "{{ app_dir }}/web/static/"
        owner: pi
        group: pi
        mode: "0755"
      notify: restart gate_anpr_web

    # --- Python worker ---
    - name: Copy Python gate worker
      copy:
        src: files/new_gate_anpr.py
        dest: "{{ script_path }}"
        owner: pi
        group: pi
        mode: "0755"
      notify: restart gate_anpr

    - name: Check for local gate_anpr env file
      stat:
        path: files/gate_anpr.env
      delegate_to: localhost
      become: false
      run_once: true
      register: gate_anpr_env

    - name: Install gate_anpr env file (if present)
      copy:
        src: files/gate_anpr.env
        dest: /etc/gate_anpr.env
        owner: root
        group: root
        mode: "0600"
      when: gate_anpr_env.stat.exists
      notify:
        - restart gate_anpr
        - restart gate_anpr_web
        - restart gate_anpr_stream_jpeg

    - name: Check for local allowlist file
      stat:
        path: files/plate_allowlist.json
      delegate_to: localhost
      become: false
      run_once: true
      register: gate_anpr_allowlist

    - name: Install allowlist file (if present)
      copy:
        src: files/plate_allowlist.json
        dest: /opt/gate_anpr/allowlist.json
        owner: pi
        group: pi
        mode: "0644"
      when: gate_anpr_allowlist.stat.exists
      notify: restart gate_anpr

    - name: Check for remote allowlist file
      stat:
        path: /opt/gate_anpr/allowlist.json
      register: gate_anpr_allowlist_remote

    - name: Create empty allowlist file if missing
      copy:
        dest: /opt/gate_anpr/allowlist.json
        content: "[]\n"
        owner: pi
        group: pi
        mode: "0644"
      when: not gate_anpr_allowlist_remote.stat.exists
      notify: restart gate_anpr

    - name: Remove venv when forcing a rebuild
      file:
        path: "{{ venv_path }}"
        state: absent
      when: (recreate_venv | default(false)) | bool

    - name: Create Python venv if missing (use system site-packages for RPi.GPIO)
      command: python3 -m venv --system-site-packages "{{ venv_path }}"
      args:
        creates: "{{ venv_path }}/bin/python"

    - name: Install Python dependencies into venv
      pip:
        virtualenv: "{{ venv_path }}"
        name:
          - requests
          - greenstalk
          - flask

    - name: Ensure libcap utilities are installed (for binding to port 80)
      apt:
        name: libcap2-bin
        state: present

    - name: Resolve venv python path for setcap
      command: readlink -f "{{ venv_path }}/bin/python"
      register: venv_python_real
      changed_when: false

    - name: Allow venv python to bind low ports
      command: setcap cap_net_bind_service=+ep "{{ venv_python_real.stdout }}"
      when: venv_python_real.stdout != ""

    # --- systemd services ---
    # If OpenALPR came from apt, openalpr-daemon unit exists. If built, we create our own alprd unit.
    - name: Install systemd unit for alprd (source-build or override-friendly)
      copy:
        dest: /etc/systemd/system/alprd.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=OpenALPR Daemon (alprd)
          {% if alprd_stream_is_http %}
          After=network-online.target beanstalkd.service gate_anpr_stream.service
          Wants=network-online.target
          Requires=beanstalkd.service gate_anpr_stream.service
          {% elif alprd_v4l2_enabled %}
          After=network-online.target beanstalkd.service gate_anpr_rtsp_v4l2.service
          Wants=network-online.target
          Requires=beanstalkd.service gate_anpr_rtsp_v4l2.service
          BindsTo=gate_anpr_rtsp_v4l2.service
          {% else %}
          After=network-online.target beanstalkd.service
          Wants=network-online.target
          Requires=beanstalkd.service
          {% endif %}
          StartLimitIntervalSec=0

          [Service]
          Type=simple
          User=pi
          Group=pi
          WorkingDirectory=/home/pi
          Environment=OPENCV_FFMPEG_CAPTURE_OPTIONS=rtsp_transport;tcp|stimeout;5000000
          StandardOutput=journal
          StandardError=journal
          SyslogIdentifier=alprd
          {% if alprd_cpu_affinity | length > 0 %}
          CPUAffinity={{ alprd_cpu_affinity }}
          {% endif %}
          {% if alprd_v4l2_enabled %}
          ExecStartPre=/bin/sh -c 'for i in $(seq 1 30); do v4l2-ctl -d {{ alprd_v4l2_device }} --stream-mmap --stream-count=1 >/dev/null 2>&1 && exit 0; sleep 1; done; exit 1'
          {% endif %}
          ExecStart={{ alprd_bin }} --config /etc/openalpr/ -l /var/log/alpr.log -f
          Restart=always
          RestartSec=5s

          [Install]
          WantedBy=multi-user.target
      notify: daemon-reload

    - name: Install systemd unit for gate_anpr
      copy:
        dest: /etc/systemd/system/gate_anpr.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Opens the Gate if a matching reg plate is seen.
          After=network-online.target beanstalkd.service alprd.service
          Wants=network-online.target
          Requires=beanstalkd.service alprd.service
          StartLimitIntervalSec=0

          [Service]
          Type=simple
          User=pi
          WorkingDirectory={{ app_dir }}
          EnvironmentFile=-/etc/gate_anpr.env
          ExecStart={{ venv_path }}/bin/python -u {{ script_path }}
          StandardOutput=journal
          StandardError=journal
          SyslogIdentifier=gate_anpr
          Restart=always
          RestartSec=5s

          [Install]
          WantedBy=multi-user.target
      notify: daemon-reload

    - name: Install systemd unit for gate_anpr_web
      copy:
        dest: /etc/systemd/system/gate_anpr_web.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Gate ANPR Web UI
          After=network-online.target gate_anpr.service
          Wants=network-online.target
          StartLimitIntervalSec=0

          [Service]
          Type=simple
          User=pi
          WorkingDirectory={{ app_dir }}/web
          EnvironmentFile=-/etc/gate_anpr.env
          ExecStart={{ venv_path }}/bin/python {{ app_dir }}/web/app.py
          Restart=always
          RestartSec=5s

          [Install]
          WantedBy=multi-user.target
      notify: daemon-reload

    - name: Install systemd unit for gate_anpr_rtsp_v4l2
      copy:
        dest: /etc/systemd/system/gate_anpr_rtsp_v4l2.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Gate ANPR RTSP to v4l2loopback (hardware decode)
          After=network-online.target
          Wants=network-online.target alprd.service
          Before=alprd.service
          StartLimitIntervalSec=0

          [Service]
          Type=simple
          User=pi
          Environment=ALPRD_RTSP_URL={{ alprd_rtsp_source }}
          ExecStart=/bin/sh -c 'for i in $(seq 1 20); do /usr/bin/ffmpeg -hide_banner -loglevel warning -rtsp_transport tcp -fflags +genpts+igndts -flags low_delay -analyzeduration 0 -probesize 32k -max_delay 0 -i ${ALPRD_RTSP_URL} -vf fps={{ alprd_v4l2_fps }},format=yuyv422 -map 0:v -c:v rawvideo -pix_fmt yuyv422 -f v4l2 {{ alprd_v4l2_device }} -map 0:v -c:v rawvideo -pix_fmt yuyv422 -f v4l2 {{ alprd_v4l2_web_device }} && exit 0; sleep 2; done; exit 1'
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      when: alprd_v4l2_enabled | bool
      notify: daemon-reload

    - name: Install v4l2 watchdog script
      copy:
        dest: /usr/local/bin/gate_anpr_v4l2_watchdog.sh
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          set -eu
          DEV="{{ alprd_v4l2_device }}"
          if ! systemctl is-active --quiet gate_anpr_rtsp_v4l2; then
            systemctl restart gate_anpr_rtsp_v4l2
            exit 0
          fi
          if ! timeout 3 v4l2-ctl -d "$DEV" --stream-mmap --stream-count=1 >/dev/null 2>&1; then
            systemctl restart gate_anpr_rtsp_v4l2
          fi
      when: alprd_v4l2_enabled | bool

    - name: Install systemd unit for gate_anpr_v4l2_watchdog
      copy:
        dest: /etc/systemd/system/gate_anpr_v4l2_watchdog.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Gate ANPR v4l2 watchdog
          After=gate_anpr_rtsp_v4l2.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/gate_anpr_v4l2_watchdog.sh
      when: alprd_v4l2_enabled | bool
      notify: daemon-reload

    - name: Install systemd timer for gate_anpr_v4l2_watchdog
      copy:
        dest: /etc/systemd/system/gate_anpr_v4l2_watchdog.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Gate ANPR v4l2 watchdog timer

          [Timer]
          OnBootSec=30s
          OnUnitActiveSec=30s
          AccuracySec=5s

          [Install]
          WantedBy=timers.target
      when: alprd_v4l2_enabled | bool
      notify: daemon-reload

    - name: Install stream watchdog script
      copy:
        dest: /usr/local/bin/gate_anpr_stream_watchdog.sh
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          set -eu
          FILE="{{ gate_web_stream_jpeg }}"
          if ! systemctl is-active --quiet gate_anpr_stream_jpeg; then
            systemctl restart gate_anpr_stream_jpeg
            exit 0
          fi
          if [ ! -f "$FILE" ]; then
            systemctl restart gate_anpr_stream_jpeg
            exit 0
          fi
          NOW=$(date +%s)
          MTIME=$(stat -c %Y "$FILE" 2>/dev/null || echo 0)
          AGE=$((NOW - MTIME))
          if [ "$AGE" -gt 20 ]; then
            systemctl restart gate_anpr_stream_jpeg
          fi

    - name: Install systemd unit for stream watchdog
      copy:
        dest: /etc/systemd/system/gate_anpr_stream_watchdog.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Gate ANPR stream watchdog
          After=gate_anpr_stream_jpeg.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/gate_anpr_stream_watchdog.sh
      when: gate_web_stream_rtsp_url | length > 0 or alprd_v4l2_enabled | bool
      notify: daemon-reload

    - name: Install systemd timer for stream watchdog
      copy:
        dest: /etc/systemd/system/gate_anpr_stream_watchdog.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Gate ANPR stream watchdog timer

          [Timer]
          OnBootSec=30s
          OnUnitActiveSec=20s
          AccuracySec=5s

          [Install]
          WantedBy=timers.target
      when: gate_web_stream_rtsp_url | length > 0 or alprd_v4l2_enabled | bool
      notify: daemon-reload

    - name: Install systemd unit for gate_anpr_stream_jpeg
      copy:
        dest: /etc/systemd/system/gate_anpr_stream_jpeg.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Gate ANPR Live Stream (RTSP to JPEG)
          After=network-online.target
          Wants=network-online.target
          {% if alprd_v4l2_enabled %}
          After=gate_anpr_rtsp_v4l2.service
          Wants=gate_anpr_rtsp_v4l2.service
          {% endif %}

          [Service]
          Type=simple
          User=pi
          EnvironmentFile=-/etc/gate_anpr.env
          {% if alprd_v4l2_enabled %}
          Environment=GATE_WEB_STREAM_INPUT={{ alprd_v4l2_web_device }}
          ExecStartPre=/bin/sh -c 'for i in $(seq 1 30); do v4l2-ctl -d {{ alprd_v4l2_web_device }} --stream-mmap --stream-count=1 >/dev/null 2>&1 && exit 0; sleep 1; done; exit 1'
          ExecStart=/bin/sh -c 'exec ionice -c2 -n7 nice -n 10 /usr/bin/ffmpeg -hide_banner -loglevel warning -fflags nobuffer -flags low_delay -f v4l2 -input_format yuyv422 -i ${GATE_WEB_STREAM_INPUT} -an -vf scale=${GATE_WEB_STREAM_WIDTH}:${GATE_WEB_STREAM_HEIGHT} -r ${GATE_WEB_STREAM_FPS} -q:v 7 -update 1 -y {{ gate_web_stream_jpeg }}'
          {% else %}
          Environment=GATE_WEB_STREAM_RTSP_URL={{ gate_web_stream_rtsp_url }}
          ExecStart=/bin/sh -c 'exec ionice -c2 -n7 nice -n 10 /usr/bin/ffmpeg -hide_banner -loglevel warning -fflags nobuffer -flags low_delay -analyzeduration 0 -probesize 32k -max_delay 0 -rtsp_transport tcp -i ${GATE_WEB_STREAM_RTSP_URL} -an -vf scale=${GATE_WEB_STREAM_WIDTH}:${GATE_WEB_STREAM_HEIGHT} -r ${GATE_WEB_STREAM_FPS} -q:v 7 -update 1 -y {{ gate_web_stream_jpeg }}'
          {% endif %}
          Restart=always
          RestartSec=5s

          [Install]
          WantedBy=multi-user.target
      when: gate_web_stream_rtsp_url | length > 0
      notify: daemon-reload

    - name: Reload systemd units after updates
      systemd:
        daemon_reload: true

    - name: Enable and start services
      systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - beanstalkd
        - alprd
        - gate_anpr
        - gate_anpr_web

    - name: Enable and start RTSP v4l2 loopback service
      systemd:
        name: gate_anpr_rtsp_v4l2
        enabled: true
        state: started
      when: alprd_v4l2_enabled | bool

    - name: Enable and start v4l2 watchdog timer
      systemd:
        name: gate_anpr_v4l2_watchdog.timer
        enabled: true
        state: started
      when: alprd_v4l2_enabled | bool

    - name: Enable and start JPEG stream service
      systemd:
        name: gate_anpr_stream_jpeg
        enabled: true
        state: started
      when: gate_web_stream_rtsp_url | length > 0 or alprd_v4l2_enabled | bool

    - name: Enable and start stream watchdog timer
      systemd:
        name: gate_anpr_stream_watchdog.timer
        enabled: true
        state: started
      when: gate_web_stream_rtsp_url | length > 0 or alprd_v4l2_enabled | bool

    - name: Restart web UI to load stream URL
      systemd:
        name: gate_anpr_web
        state: restarted
      when: gate_web_stream_url | length > 0

    # --- Sanity checks ---
    - name: Verify alprd binary exists (source build installs to /usr/local/bin)
      command: "{{ alprd_bin }} --version"
      register: alprd_version
      changed_when: false
      failed_when: alprd_version.rc not in [0, 1]

    - name: Verify Python imports inside venv
      command: "{{ venv_path }}/bin/python -c \"import requests, greenstalk; import RPi.GPIO\""
      changed_when: false

    - name: Enqueue synthetic ALPR job (optional)
      command: >
        {{ venv_path }}/bin/python {{ app_dir }}/tests/synthetic_job.py
        --plate {{ synthetic_plate | default('A1ABC') }}
        --delay {{ synthetic_delay | default(60) }}
      when: (run_synthetic_job | default(false)) | bool
      changed_when: false

  handlers:
    - name: daemon-reload
      systemd:
        daemon_reload: true

    - name: restart alprd
      systemd:
        name: alprd
        state: restarted

    - name: restart gate_anpr
      systemd:
        name: gate_anpr
        state: restarted

    - name: restart gate_anpr_web
      systemd:
        name: gate_anpr_web
        state: restarted

    - name: restart gate_anpr_stream_jpeg
      systemd:
        name: gate_anpr_stream_jpeg
        state: restarted

    - name: restart avahi-daemon
      systemd:
        name: avahi-daemon
        state: restarted

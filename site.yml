---
- name: Provision gate ANPR stack on Pi 5 (Bookworm-safe)
  hosts: gatepi
  become: true

  vars:
    app_dir: /opt/gate_anpr
    plates_dir: /home/pi/plates
    alpr_conf_dir: /etc/openalpr
    alprd_conf_path: /etc/openalpr/alprd.conf
    openalpr_conf_path: /etc/openalpr/openalpr.conf
    venv_path: /opt/gate_anpr/venv
    script_path: /opt/gate_anpr/gate_anpr.py

    # Source build locations
    src_root: /opt/src
    openalpr_repo: https://github.com/openalpr/openalpr.git
    openalpr_src: /opt/src/openalpr
    openalpr_build: /opt/src/openalpr/build
    openalpr_install_prefix: /usr/local
    openalpr_sysconfdir: /etc
    alprd_bin: /usr/local/bin/alprd
    alprd_stream: "{{ lookup('env', 'ALPRD_STREAM') | default('/dev/video0', true) }}"

    # OpenCV 3.x build (match old Pi stack)
    build_opencv3: false
    cleanup_opencv3: true
    opencv_version: "3.2.0"
    opencv_repo: https://github.com/opencv/opencv.git
    opencv_src: /opt/src/opencv
    opencv_build: /opt/src/opencv/build
    opencv_install_prefix: /opt/opencv-3.2.0

  tasks:
    - name: Remove Debian bullseye repo (cleanup OpenCV 3.x attempt)
      file:
        path: /etc/apt/sources.list.d/bullseye.list
        state: absent
      when: cleanup_opencv3 | bool

    - name: Remove bullseye cmake pin (cleanup OpenCV 3.x attempt)
      file:
        path: /etc/apt/preferences.d/cmake-bullseye
        state: absent
      when: cleanup_opencv3 | bool

    - name: Remove OpenCV 3 build artifacts (cleanup OpenCV 3.x attempt)
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ opencv_src }}"
        - "{{ opencv_install_prefix }}"
        - /etc/ld.so.conf.d/opencv-3.conf
      when: cleanup_opencv3 | bool

    - name: Update apt cache after cleanup
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: cleanup_opencv3 | bool

    - name: Ensure cmake is on the default distro version after cleanup
      apt:
        name:
          - cmake
          - cmake-data
        state: latest
      when: cleanup_opencv3 | bool

    - name: Add Debian bullseye repo (for older cmake)
      copy:
        dest: /etc/apt/sources.list.d/bullseye.list
        owner: root
        group: root
        mode: "0644"
        content: |
          deb http://deb.debian.org/debian bullseye main
      when: build_opencv3 | bool

    - name: Pin cmake packages to bullseye
      copy:
        dest: /etc/apt/preferences.d/cmake-bullseye
        owner: root
        group: root
        mode: "0644"
        content: |
          Package: cmake cmake-data
          Pin: release n=bullseye
          Pin-Priority: 990
      when: build_opencv3 | bool

    - name: Update apt cache after adding bullseye repo
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: build_opencv3 | bool

    - name: Read installed cmake version
      command: dpkg-query -W -f='${Version}' cmake
      register: cmake_version
      changed_when: false
      failed_when: false
      when: build_opencv3 | bool

    - name: Read installed cmake-data version
      command: dpkg-query -W -f='${Version}' cmake-data
      register: cmake_data_version
      changed_when: false
      failed_when: false
      when: build_opencv3 | bool

    - name: Install bullseye cmake (older version for OpenCV 3.2)
      ansible.builtin.shell: |
        apt-get -y --allow-downgrades -t bullseye install \
          cmake=3.18.4-2+deb11u1 \
          cmake-data=3.18.4-2+deb11u1
      when:
        - build_opencv3 | bool
        - cmake_version.stdout != "3.18.4-2+deb11u1"
          or cmake_data_version.stdout != "3.18.4-2+deb11u1"

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install baseline runtime packages
      apt:
        name:
          - beanstalkd
          - python3
          - python3-venv
          - python3-pip
          - python3-rpi.gpio
          - python3-lgpio
          - v4l-utils
          - gstreamer1.0-tools
          - gstreamer1.0-plugins-base
          - gstreamer1.0-plugins-good
          - gstreamer1.0-plugins-bad
          - gstreamer1.0-plugins-ugly
          - gstreamer1.0-libav
        state: present

    # --- Attempt APT OpenALPR (works on some older distros; not on Bookworm) ---
    - name: Try to install OpenALPR packages from apt (may not exist)
      apt:
        name:
          - openalpr
          - openalpr-daemon
          - openalpr-utils
        state: present
      register: apt_openalpr
      ignore_errors: true

    - name: Check for existing alprd binary
      stat:
        path: "{{ alprd_bin }}"
      register: alprd_existing

    - name: Decide if we must build OpenALPR from source
      set_fact:
        build_openalpr_from_source: "{{ (apt_openalpr is failed) and (not alprd_existing.stat.exists) }}"

    # --- If apt failed, build from source (Bookworm-safe path) ---
    - name: Install build dependencies for OpenALPR (only if building)
      apt:
        name:
          - git
          - cmake
          - build-essential
          - pkg-config
          - libopencv-dev
          - libleptonica-dev
          - libtesseract-dev
          - tesseract-ocr
          - liblog4cplus-dev
          - libcurl4-openssl-dev
          - libcurlpp-dev
          - libjsoncpp-dev
          - libpng-dev
          - libjpeg-dev
          - zlib1g-dev
        state: present
      when: build_openalpr_from_source

    - name: Install build dependencies for OpenCV 3 (only if building OpenCV 3)
      apt:
        name:
          - git
          - cmake
          - build-essential
          - gcc-12
          - g++-12
          - pkg-config
          - libgtk-3-dev
          - libavcodec-dev
          - libavformat-dev
          - libavutil-dev
          - libswscale-dev
          - libswresample-dev
          - libavdevice-dev
          - libgstreamer1.0-dev
          - libgstreamer-plugins-base1.0-dev
          - libv4l-dev
          - libxvidcore-dev
          - libx264-dev
          - libjpeg-dev
          - libpng-dev
          - libtiff-dev
        state: present
      when: build_opencv3 | bool

    - name: Ensure source root exists (only if building)
      file:
        path: "{{ src_root }}"
        state: directory
        mode: "0755"
      when: build_openalpr_from_source

    - name: Clone OpenCV source (only if building OpenCV 3)
      git:
        repo: "{{ opencv_repo }}"
        dest: "{{ opencv_src }}"
        version: "{{ opencv_version }}"
        depth: 1
      when: build_opencv3 | bool

    - name: Clear OpenCV build dir
      file:
        path: "{{ opencv_build }}"
        state: absent
      when: build_opencv3 | bool

    - name: Configure OpenCV build (only if building OpenCV 3)
      command: >
        cmake -S {{ opencv_src }} -B {{ opencv_build }}
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_INSTALL_PREFIX={{ opencv_install_prefix }}
        -DCMAKE_C_COMPILER=/usr/bin/gcc-12
        -DCMAKE_CXX_COMPILER=/usr/bin/g++-12
        -DCMAKE_C_STANDARD=11
        -DCMAKE_CXX_STANDARD=11
        -DBUILD_TESTS=OFF
        -DBUILD_PERF_TESTS=OFF
        -DBUILD_EXAMPLES=OFF
        -DBUILD_opencv_python2=OFF
        -DBUILD_opencv_python3=OFF
        -DWITH_FFMPEG=OFF
        -DWITH_GSTREAMER=ON
      args:
        creates: "{{ opencv_build }}/Makefile"
      when: build_opencv3 | bool

    - name: Build OpenCV 3 (only if building OpenCV 3)
      command: cmake --build {{ opencv_build }} -j2
      when: build_opencv3 | bool

    - name: Install OpenCV 3 (only if building OpenCV 3)
      command: cmake --install {{ opencv_build }}
      when: build_opencv3 | bool

    - name: Register OpenCV 3 library path
      copy:
        dest: /etc/ld.so.conf.d/opencv-3.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          {{ opencv_install_prefix }}/lib
      when: build_opencv3 | bool

    - name: Refresh linker cache (OpenCV 3)
      command: ldconfig
      when: build_opencv3 | bool

    - name: Clone OpenALPR source (only if building)
      git:
        repo: "{{ openalpr_repo }}"
        dest: "{{ openalpr_src }}"
        depth: 1
      when: build_openalpr_from_source

    - name: Clear OpenALPR build dir when using OpenCV 3
      file:
        path: "{{ openalpr_build }}"
        state: absent
      when: build_openalpr_from_source and (build_opencv3 | bool)

    - name: Set OpenALPR cmake extra args for OpenCV 3
      set_fact:
        openalpr_cmake_extra: >-
          -DCMAKE_PREFIX_PATH={{ opencv_install_prefix }}
          -DOpenCV_DIR={{ opencv_install_prefix }}/share/OpenCV
      when: build_openalpr_from_source and (build_opencv3 | bool)

    - name: Configure OpenALPR build (only if building)
      command: >
        cmake -S {{ openalpr_src }}/src -B {{ openalpr_build }}
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_INSTALL_PREFIX={{ openalpr_install_prefix }}
        -DCMAKE_INSTALL_SYSCONFDIR={{ openalpr_sysconfdir }}
        -DTesseract_INCLUDE_DIR=/usr/include/tesseract
        -DTesseract_INCLUDE_CCMAIN_DIR=/usr/include/tesseract
        -DTesseract_INCLUDE_CCUTIL_DIR=/usr/include/tesseract
        -DTesseract_LIB=/usr/lib/aarch64-linux-gnu/libtesseract.so
        -DLeptonica_INCLUDE_DIR=/usr/include/leptonica
        -DLeptonica_LIB=/usr/lib/aarch64-linux-gnu/libleptonica.so
        {{ openalpr_cmake_extra | default('') }}
      args:
        creates: "{{ openalpr_build }}/Makefile"
      when: build_openalpr_from_source


    - name: Build OpenALPR (only if building)
      command: cmake --build {{ openalpr_build }} -j2
      when: build_openalpr_from_source

    - name: Install OpenALPR (only if building)
      command: cmake --install {{ openalpr_build }}
      when: build_openalpr_from_source

    - name: Refresh linker cache (only if building)
      command: ldconfig
      when: build_openalpr_from_source

    # --- OpenALPR config files ---
    - name: Ensure OpenALPR config directory exists
      file:
        path: "{{ alpr_conf_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure alprd log file exists (writable by pi)
      file:
        path: /var/log/alpr.log
        state: touch
        owner: pi
        group: pi
        mode: "0644"

    - name: Render alprd.conf (site-specific)
      template:
        src: files/alprd.conf.j2
        dest: "{{ alprd_conf_path }}"
        owner: root
        group: root
        mode: "0644"
      notify: restart alprd

    - name: Set openalpr.conf for eu and legacy tuning
      copy:
        dest: "{{ openalpr_conf_path }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          ; Use runtime/config copied from old Pi (apt layout)
          config_file = /usr/share/openalpr/config/openalpr.defaults.conf
          runtime_dir = /usr/share/openalpr/runtime_data
          country = eu
          max_plate_width_percent = 30
          max_plate_height_percent = 30
          must_match_pattern = 1
      notify: restart alprd

    # --- Runtime dirs ---
    - name: Ensure plates directory exists
      file:
        path: "{{ plates_dir }}"
        state: directory
        owner: pi
        group: pi
        mode: "0755"

    - name: Ensure app directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: pi
        group: pi
        mode: "0755"

    - name: Ensure app tests directory exists
      file:
        path: "{{ app_dir }}/tests"
        state: directory
        owner: pi
        group: pi
        mode: "0755"

    - name: Copy synthetic job helper
      copy:
        src: tests/synthetic_job.py
        dest: "{{ app_dir }}/tests/synthetic_job.py"
        owner: pi
        group: pi
        mode: "0755"

    # --- Python worker ---
    - name: Copy Python gate worker
      copy:
        src: files/new_gate_anpr.py
        dest: "{{ script_path }}"
        owner: pi
        group: pi
        mode: "0755"
      notify: restart gate_anpr

    - name: Ensure gate_anpr log directory exists
      file:
        path: /var/log/gate-anpr
        state: directory
        owner: pi
        group: pi
        mode: "0755"

    - name: Check for local gate_anpr env file
      stat:
        path: files/gate_anpr.env
      delegate_to: localhost
      become: false
      run_once: true
      register: gate_anpr_env

    - name: Install gate_anpr env file (if present)
      copy:
        src: files/gate_anpr.env
        dest: /etc/gate_anpr.env
        owner: root
        group: root
        mode: "0600"
      when: gate_anpr_env.stat.exists
      notify: restart gate_anpr

    - name: Check for local allowlist file
      stat:
        path: files/plate_allowlist.json
      delegate_to: localhost
      become: false
      run_once: true
      register: gate_anpr_allowlist

    - name: Install allowlist file (if present)
      copy:
        src: files/plate_allowlist.json
        dest: /etc/gate_anpr_allowlist.json
        owner: root
        group: root
        mode: "0644"
      when: gate_anpr_allowlist.stat.exists
      notify: restart gate_anpr

    - name: Remove venv when forcing a rebuild
      file:
        path: "{{ venv_path }}"
        state: absent
      when: (recreate_venv | default(false)) | bool

    - name: Create Python venv if missing (use system site-packages for RPi.GPIO)
      command: python3 -m venv --system-site-packages "{{ venv_path }}"
      args:
        creates: "{{ venv_path }}/bin/python"

    - name: Install Python dependencies into venv
      pip:
        virtualenv: "{{ venv_path }}"
        name:
          - requests
          - greenstalk

    # --- systemd services ---
    # If OpenALPR came from apt, openalpr-daemon unit exists. If built, we create our own alprd unit.
    - name: Install systemd unit for alprd (source-build or override-friendly)
      copy:
        dest: /etc/systemd/system/alprd.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=OpenALPR Daemon (alprd)
          After=network-online.target beanstalkd.service
          Wants=network-online.target
          Requires=beanstalkd.service

          [Service]
          Type=simple
          User=pi
          Group=pi
          WorkingDirectory=/home/pi
          Environment=OPENCV_FFMPEG_CAPTURE_OPTIONS=rtsp_transport;tcp|stimeout;5000000
          ExecStartPre=/usr/bin/v4l2-ctl --device=/dev/video0 --set-fmt-video=width=1920,height=1080,pixelformat=MJPG
          ExecStart={{ alprd_bin }} --config /etc/openalpr/ -l /var/log/alpr.log -f
          Restart=on-failure
          RestartSec=5s

          [Install]
          WantedBy=multi-user.target
      notify: daemon-reload

    - name: Install systemd unit for gate_anpr
      copy:
        dest: /etc/systemd/system/gate_anpr.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Opens the Gate if a matching reg plate is seen.
          After=network-online.target beanstalkd.service alprd.service
          Wants=network-online.target
          Requires=beanstalkd.service alprd.service

          [Service]
          Type=simple
          User=pi
          WorkingDirectory={{ app_dir }}
          EnvironmentFile=-/etc/gate_anpr.env
          ExecStart={{ venv_path }}/bin/python -u {{ script_path }}
          StandardOutput=append:/var/log/gate-anpr/gate-anpr.log
          StandardError=inherit
          Restart=on-failure
          RestartSec=5s

          [Install]
          WantedBy=multi-user.target
      notify: daemon-reload

    - name: Enable and start services
      systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - beanstalkd
        - alprd
        - gate_anpr

    # --- Sanity checks ---
    - name: Verify alprd binary exists (source build installs to /usr/local/bin)
      command: "{{ alprd_bin }} --version"
      register: alprd_version
      changed_when: false
      failed_when: alprd_version.rc not in [0, 1]

    - name: Verify Python imports inside venv
      command: "{{ venv_path }}/bin/python -c \"import requests, greenstalk; import RPi.GPIO\""
      changed_when: false

    - name: Enqueue synthetic ALPR job (optional)
      command: >
        {{ venv_path }}/bin/python {{ app_dir }}/tests/synthetic_job.py
        --plate {{ synthetic_plate | default('A1ABC') }}
        --delay {{ synthetic_delay | default(60) }}
      when: (run_synthetic_job | default(false)) | bool
      changed_when: false

  handlers:
    - name: daemon-reload
      systemd:
        daemon_reload: true

    - name: restart alprd
      systemd:
        name: alprd
        state: restarted

    - name: restart gate_anpr
      systemd:
        name: gate_anpr
        state: restarted

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test image stream refresh
        run: node tests/stream_refresh.js

      - name: Test history pagination and filters
        run: node tests/history.js

      - name: Test gate controls and request failures
        run: node tests/gate_controls.js

      - name: Test stream diagnostics and navigation requests
        run: node tests/web_diagnostics.js

      - name: Test home status, arrivals and allowlist feedback
        run: node tests/home_status.js

      - name: Test statistics periods, chart bounds and request failures
        run: node tests/stats.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r files/requirements.txt ruff pytest

      - name: Lint (ruff check)
        run: ruff check files/ tests/

      - name: Format check (ruff format)
        run: ruff format --check files/ tests/

      - name: Run tests
        env:
          GATE_API_SHARED_SECRET: test-secret-for-ci
          GATE_ALLOWED_ORIGINS: "http://localhost,http://gatepi5"
        run: pytest tests/ -v

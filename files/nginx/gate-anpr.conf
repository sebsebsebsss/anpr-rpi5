server {
    listen 80;
    server_name gatepi5 gatepi5.local _;

    # Pass all requests to waitress on 127.0.0.1:8080, except the JPEG stream
    # which nginx serves directly from disk with sendfile.
    location /static/stream.jpg {
        alias {{ gate_web_stream_jpeg }};
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        access_log off;
    }

    location /api/gate-cooldown {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}

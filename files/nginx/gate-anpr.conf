{% macro gate_locations() %}
    # Pass all requests to waitress on 127.0.0.1:8080, except the JPEG stream
    # which nginx serves directly from disk with sendfile.
    location = /static/stream.jpg {
        alias {{ gate_web_stream_jpeg }};
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        access_log off;
    }

    location /api/gate-cooldown {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
{% endmacro %}
# Default server: drop requests whose Host header is not a recognised name for
# this Pi. This is the DNS-rebinding defence — the UI hands the API secret to
# any page served from "/", and the CSRF check is same-origin (Origin == Host),
# so a rebound attacker hostname must never reach the app at all.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name
        localhost
        127.0.0.1
        {{ ansible_default_ipv4.address }}
        {{ ansible_hostname }}
        {{ ansible_hostname }}.local
{% if gatepi_alias_hostname | length > 0 %}
        {{ gatepi_alias_hostname }}
        {{ gatepi_alias_hostname }}.local
{% endif %}
{% if gate_https_domain | length > 0 %}
        {{ gate_https_domain }}
{% endif %}
        ;

{{ gate_locations() }}
}

{% if gate_https_enabled | bool %}
# Reject unknown TLS names and HTTP Host values without serving the API secret.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 443 ssl;
    http2 on;
    server_name {{ gate_https_domain }};
    ssl_certificate {{ gate_https_cert_path }};
    ssl_certificate_key {{ gate_https_key_path }};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:GateTLS:1m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
{{ gate_locations() }}
}
{% endif %}

# Default server: drop requests whose Host header is not a recognised name for
# this Pi. This is the DNS-rebinding defence — the UI hands the API secret to
# any page served from "/", and the CSRF check is same-origin (Origin == Host),
# so a rebound attacker hostname must never reach the app at all.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name
        localhost
        127.0.0.1
        {{ ansible_default_ipv4.address }}
        {{ ansible_hostname }}
        {{ ansible_hostname }}.local
{% if gatepi_alias_hostname | length > 0 %}
        {{ gatepi_alias_hostname }}
        {{ gatepi_alias_hostname }}.local
{% endif %}
        ;

    # Pass all requests to waitress on 127.0.0.1:8080, except the JPEG stream
    # which nginx serves directly from disk with sendfile.
    location /static/stream.jpg {
        alias {{ gate_web_stream_jpeg }};
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        access_log off;
    }

    location /api/gate-cooldown {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
